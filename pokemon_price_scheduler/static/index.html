<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokemon Price Tracker</title>
  <link rel="icon" type="image/avif" href="https://img.pokemondb.net/sprites/scarlet-violet/icon/avif/charizard.avif">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/ag-grid/ag-grid.css">
  <link rel="stylesheet" href="/vendor/ag-grid/ag-theme-quartz.css">
  <script src="/htmx.min.js?v=3"></script>
  <script defer src="/alpine.min.js?v=3"></script>
  <script src="/vendor/ag-grid/ag-grid-community.min.js"></script>
  <style>
    :root {
      --bg:        #1a1a1e;
      --surface:   #242428;
      --surface-2: #2e2e34;
      --border:    #3a3a42;
      --text:      #e8e8ed;
      --muted:     #8b8b96;
      --accent:    #818cf8;
      --accent-h:  #a5b4fc;
      --green:     #4ade80;
      --amber:     #fbbf24;
      --red:       #f87171;
      --font-display: 'Outfit', sans-serif;
      --font-body:    'Inter', sans-serif;
      --sp-1: 8px;
      --sp-2: 16px;
      --sp-3: 24px;
      --sp-4: 32px;
      --sp-5: 40px;
      --sp-6: 48px;
      --radius-sm: 4px;
      --radius-md: 6px;
      --motion-fast: 120ms ease;
      --sidebar-w: 220px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font-body);
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      display: flex;
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-h); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar-brand {
      padding: var(--sp-3) var(--sp-3);
      border-bottom: 1px solid var(--border);
    }
    .sidebar-brand h1 {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin: 0;
      letter-spacing: 0.02em;
    }
    .sidebar-brand span {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .sidebar-section-label {
      padding: var(--sp-3) var(--sp-3) var(--sp-1);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 0 var(--sp-2) var(--sp-2);
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      transition: all var(--motion-fast);
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .sidebar nav a:hover {
      color: var(--text);
      background: var(--surface-2);
    }
    .sidebar nav a.active {
      color: var(--accent);
      background: #818cf812;
    }
    .sidebar .spacer { flex: 1; }
    .sidebar-footer {
      padding: var(--sp-2) var(--sp-3);
      border-top: 1px solid var(--border);
    }
    .sidebar-footer .btn {
      width: 100%;
      text-align: center;
    }
    .app {
      display: flex;
      flex: 1;
      min-height: 100vh;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .topbar {
      padding: var(--sp-2) var(--sp-4);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
    }
    .topbar h1 {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
      letter-spacing: -0.01em;
      flex: 1;
    }
    .topbar-meta {
      font-size: 12px;
      color: var(--muted);
    }
    .main { padding: var(--sp-4); flex: 1; overflow-y: auto; }
    .btn {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      color: var(--bg);
      background: var(--accent);
      border: none;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--motion-fast), transform var(--motion-fast);
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-h); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }
    .btn.running { background: var(--amber); }
    .page-actions {
      display: flex;
      justify-content: flex-end;
      gap: var(--sp-1);
      margin-bottom: var(--sp-2);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    thead { background: var(--surface-2); }
    th {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px var(--sp-2);
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 10px var(--sp-2);
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface-2); }
    tr.alert-red td { background: #f8717115; }
    tr.alert-amber td { background: #fbbf2415; }
    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .status-dot.ok     { background: var(--green); }
    .status-dot.warn   { background: var(--amber); }
    .status-dot.danger { background: var(--red); }
    .status-dot.none   { background: var(--muted); }
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: var(--sp-2);
      margin-bottom: var(--sp-3);
    }
    .metrics > div {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--sp-2) var(--sp-3);
    }
    .metrics span {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .metrics strong {
      display: block;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .dashboard-kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--sp-2);
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--sp-3);
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
      transition: border-color var(--motion-fast);
    }
    .kpi-card:hover {
      border-color: var(--accent);
    }
    .kpi-label {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .kpi-value {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .kpi-hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    .kpi-card--alert {
      border-color: #f8717140;
    }
    .kpi-card--alert:hover {
      border-color: var(--red);
    }
    .kpi-card--alert .kpi-value {
      color: var(--red);
    }
    dl {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 0 var(--sp-2);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--sp-2) var(--sp-3);
    }
    dt {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    dd {
      margin: 0;
      font-size: 13px;
      color: var(--text);
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    dl > :last-child { border-bottom: none; }
    img {
      max-width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    h2 {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text);
      margin: var(--sp-4) 0 var(--sp-2);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--sp-2);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--sp-2) var(--sp-3);
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
      text-decoration: none;
      color: var(--text);
      transition: border-color var(--motion-fast), background var(--motion-fast);
    }
    .card:hover { border-color: var(--accent); background: var(--surface-2); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-1); }
    .card-title {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      letter-spacing: 0.01em;
    }
    .alert-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 10px;
      font-weight: 600;
      font-family: var(--font-display);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .alert-badge.red   { background: #f8717115; color: var(--red); border: 1px solid var(--red); }
    .alert-badge.amber { background: #fbbf2415; color: var(--amber); border: 1px solid var(--amber); }
    .card-lang {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .card-prices { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-1); margin-top: var(--sp-1); }
    .price-box {
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      border: 1px solid var(--border);
    }
    .price-box span {
      display: block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .price-box strong {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      font-family: var(--font-display);
      letter-spacing: -0.01em;
    }
    .trend {
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
      font-family: var(--font-display);
    }
    .trend.up      { color: var(--green); }
    .trend.down    { color: var(--red); }
    .trend.flat, .trend.neutral { color: var(--muted); }
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid var(--bg);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .htmx-indicator {
      opacity: 0;
      transition: opacity 200ms ease;
    }
    .htmx-request .htmx-indicator {
      opacity: 1;
    }
    .htmx-request.htmx-indicator {
      opacity: 1;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--sp-3);
      width: 400px;
      max-width: 90vw;
    }
    .modal h2 {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 var(--sp-2);
      padding-bottom: var(--sp-1);
      border-bottom: 1px solid var(--border);
    }
    .modal label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .modal input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
      margin-bottom: var(--sp-2);
    }
    .modal input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 200ms ease, transform 200ms ease;
      pointer-events: none;
      z-index: 2000;
    }
    .toast.visible { opacity: 1; transform: translateY(0); }
    .toast.ok     { border-color: var(--green); color: var(--green); }
    .toast.error  { border-color: var(--red);   color: var(--red);   }

    /* Trading desk refresh */
    :root {
      --bg: #101317;
      --surface: #171d23;
      --surface-2: #202833;
      --surface-3: #293340;
      --border: #33404c;
      --text: #edf3f8;
      --muted: #91a2b3;
      --accent: #22d3ee;
      --accent-h: #67e8f9;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --blue: #38bdf8;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
    }
    body {
      background:
        radial-gradient(circle at 20% -10%, rgba(34, 211, 238, 0.14), transparent 34rem),
        linear-gradient(135deg, #0e1217 0%, #101820 45%, #0b1116 100%);
    }
    .sidebar {
      background: rgba(15, 20, 26, 0.94);
      backdrop-filter: blur(18px);
    }
    .sidebar-brand h1 { font-size: 18px; letter-spacing: -0.03em; }
    .sidebar nav a {
      min-height: 38px;
      border: 1px solid transparent;
    }
    .sidebar nav a.active {
      color: var(--accent-h);
      background: rgba(34, 211, 238, 0.10);
      border-color: rgba(34, 211, 238, 0.25);
    }
    .topbar {
      background: rgba(16, 22, 29, 0.82);
      backdrop-filter: blur(18px);
    }
    .topbar h1 { font-size: 20px; }
    .main {
      background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      width: 100%;
      max-width: none;
      box-sizing: border-box;
    }
    #content {
      width: 100%;
      max-width: none;
      box-sizing: border-box;
    }
    .cards-page {
      width: 100%;
      max-width: none;
      box-sizing: border-box;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: var(--sp-2);
    }
    .repricing-controls {
      display: grid;
      gap: 12px;
      margin-bottom: var(--sp-2);
    }
    .control-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .control-label {
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .09em;
      min-width: 52px;
      text-transform: uppercase;
    }
    .btn {
      border: 1px solid rgba(34, 211, 238, 0.32);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset;
    }
    .btn--primary, .btn {
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      color: #061016;
    }
    .btn--secondary {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }
    .btn--secondary:hover {
      background: var(--surface-3);
      border-color: var(--accent);
      color: var(--accent-h);
    }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: var(--sp-2);
      margin-bottom: var(--sp-3);
    }
    .metric-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015)), var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      min-height: 112px;
    }
    .metric-card--success { border-color: rgba(34, 197, 94, 0.35); }
    .metric-card--danger { border-color: rgba(239, 68, 68, 0.45); }
    .metric-card--warning { border-color: rgba(245, 158, 11, 0.45); }
    .metric-label {
      display: block;
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .metric-value {
      display: block;
      color: var(--text);
      font-family: var(--font-display);
      font-size: clamp(22px, 2.6vw, 34px);
      line-height: 1;
      letter-spacing: -0.04em;
      margin-bottom: 10px;
    }
    .metric-hint {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .panel {
      background: rgba(23, 29, 35, 0.88);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: var(--sp-3);
      box-shadow: 0 24px 80px rgba(0,0,0,0.24);
    }
    .panel-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--sp-2);
      margin-bottom: var(--sp-2);
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .panel-header h2 {
      border: 0;
      padding: 0;
      margin: 0;
      font-size: 15px;
    }
    .panel-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin: 0;
      max-width: 520px;
    }
    .table-shell {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      width: 100%;
      max-width: none;
      box-sizing: border-box;
    }
    table {
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    th {
      background: #111820;
      color: #9fb3c8;
      border-bottom-color: var(--border);
    }
    td {
      border-bottom-color: rgba(51, 64, 76, 0.72);
    }
    .grid-shell {
      min-height: 360px;
      padding: 0;
      width: 100%;
      max-width: none;
      box-sizing: border-box;
    }
    .ag-grid-host {
      width: 100%;
      max-width: none;
      height: 420px;
      border-radius: var(--radius-md);
      min-width: 0;
      box-sizing: border-box;
      --ag-background-color: #111827;
      --ag-foreground-color: #e5e7eb;
      --ag-data-color: #e5e7eb;
      --ag-secondary-foreground-color: #a9bbcc;
      --ag-header-background-color: #1f2937;
      --ag-header-foreground-color: #f9fafb;
      --ag-border-color: #374151;
      --ag-row-border-color: #374151;
      --ag-odd-row-background-color: #171f27;
      --ag-row-hover-color: #243244;
      --ag-selected-row-background-color: rgba(34, 211, 238, 0.16);
      --ag-control-panel-background-color: #151b22;
      --ag-subheader-background-color: #151b22;
      --ag-input-background-color: #101820;
      --ag-input-text-color: var(--text);
      --ag-modal-overlay-background-color: rgba(4, 8, 12, 0.65);
      color: var(--text);
    }
    .cards-page .cards-data-grid.grid-shell {
      width: 100%;
      max-width: none;
      height: calc(100vh - 260px);
      min-height: 520px;
      box-sizing: border-box;
    }
    .cards-page .cards-data-grid .ag-grid-host,
    .cards-page .cards-data-grid.ag-grid-host {
      width: 100%;
      max-width: none;
      height: 100%;
      min-height: 520px;
      box-sizing: border-box;
    }
    .cards-page .cards-data-grid a,
    .cards-page .cards-data-grid .table-title {
      color: #93c5fd;
      text-decoration: none;
    }
    .cards-page .cards-data-grid a:hover,
    .cards-page .cards-data-grid .table-title:hover {
      color: #bfdbfe;
      text-decoration: underline;
    }
    .data-table--compact .ag-grid-host {
      height: 320px;
    }
    .ag-cell {
      display: flex;
      align-items: center;
      color: #e5e7eb;
    }
    .ag-header-cell-text {
      color: #f9fafb;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .table-title {
      display: block;
      color: #9eeaff;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.35;
      text-decoration: none;
    }
    .table-title:hover {
      color: #dff8ff;
    }
    .table-subtitle {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .table-money {
      color: #f4f8fb;
      font-weight: 850;
      letter-spacing: .01em;
    }
    .table-percent {
      font-weight: 850;
    }
    .table-percent--positive { color: var(--green); }
    .table-percent--negative { color: var(--red); }
    .table-percent--neutral { color: var(--muted); }
    .table-muted {
      color: var(--muted);
      font-weight: 650;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(255,255,255,0.03);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .status-badge--success { border-color: rgba(34,197,94,.45); color: var(--green); background: rgba(34,197,94,.10); }
    .status-badge--danger { border-color: rgba(239,68,68,.5); color: var(--red); background: rgba(239,68,68,.10); }
    .status-badge--warning { border-color: rgba(245,158,11,.5); color: var(--amber); background: rgba(245,158,11,.10); }
    .status-badge--neutral { border-color: rgba(34,211,238,.35); color: var(--accent-h); background: rgba(34,211,238,.08); }
    .status-badge--muted { color: var(--muted); }
    .field-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: var(--sp-2);
      align-items: start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--sp-2);
      margin-bottom: var(--sp-3);
    }
    .field-row label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .09em;
      padding-top: 10px;
    }
    .field-control {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .input, .modal input {
      width: 100%;
      min-height: 38px;
      background: #111820;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 8px 11px;
      font-size: 13px;
    }
    .input:focus, .modal input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(34,211,238,.12);
    }
    .field-help {
      color: var(--muted);
      font-size: 11px;
    }
    .identity-layout {
      display: grid;
      grid-template-columns: minmax(180px, 30%) minmax(0, 70%);
      gap: var(--sp-3);
      align-items: start;
    }
    .identity-picture-block,
    .identity-detail-block {
      min-width: 0;
    }
    .identity-media {
      display: grid;
      gap: 8px;
      align-content: start;
      justify-items: stretch;
    }
    .identity-media--empty {
      min-height: 180px;
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      padding: var(--sp-3);
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      place-items: center;
      text-align: center;
    }
    .card-image {
      display: block;
      width: 100%;
      max-width: 260px;
      aspect-ratio: 3 / 4;
      object-fit: contain;
      object-position: center;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      padding: 8px;
      background: #111820;
      image-rendering: auto;
    }
    .identity-list {
      display: grid;
      grid-template-columns: minmax(110px, 170px) 1fr;
      gap: 0;
      margin: 0;
      background: transparent;
      border: 0;
      padding: 0;
    }
    .chart-image {
      width: 100%;
      display: block;
      background: #111820;
      border-color: var(--border);
      border-radius: var(--radius-md);
    }
    .empty-state {
      display: grid;
      gap: 6px;
      padding: var(--sp-4);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      text-align: center;
    }
    .empty-state strong {
      color: var(--text);
      font-family: var(--font-display);
      font-size: 16px;
    }
    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--sp-2);
    }
    .product-card__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--sp-1);
      margin-bottom: var(--sp-1);
    }
    .product-card__title {
      color: var(--text);
      font-weight: 800;
      line-height: 1.35;
    }
    .product-card__meta {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: var(--sp-1);
    }
    .mini-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--sp-1);
    }
    .mini-metrics .metric-card {
      min-height: auto;
      padding: 12px;
    }
    .mini-metrics .metric-value { font-size: 17px; }
    .card-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: var(--sp-2);
    }
    .trend--up { color: var(--green); }
    .trend--down { color: var(--red); }
    .trend--flat { color: var(--muted); }
    #loading-msg {
      color: var(--muted);
      padding: var(--sp-4);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.02);
    }
    @media (max-width: 860px) {
      body { display: block; }
      .sidebar {
        position: relative;
        width: 100%;
        min-width: 0;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .sidebar nav {
        flex-direction: row;
        overflow-x: auto;
      }
      .sidebar .spacer { display: none; }
      .content { min-height: auto; }
      .topbar { padding: var(--sp-2); }
      .main { padding: var(--sp-2); }
      .field-row { grid-template-columns: 1fr; }
      .field-control { flex-direction: column; align-items: stretch; }
      .toolbar { justify-content: stretch; }
      .toolbar .btn { flex: 1; text-align: center; }
      .identity-layout { grid-template-columns: 1fr; }
      .identity-media {
        justify-items: center;
      }
      .card-image {
        width: min(100%, 240px);
      }
    }
  </style>
</head>
<body x-data="app()">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>Pokemon Price</h1>
      <span>Tracker</span>
    </div>
    <div class="sidebar-section-label">Navigation</div>
    <nav>
      <a href="/" :class="{ 'active': currentPage === 'dash' }" @click.prevent="navigateTo('/')">
        <span>◈</span> Dashboard
      </a>
      <a href="/cards" :class="{ 'active': currentPage === 'cards' }" @click.prevent="navigateTo('/cards')">
        <span>◫</span> Store Listings
      </a>
      <a href="/inventory" :class="{ 'active': currentPage === 'inventory' }" @click.prevent="navigateTo('/inventory')">
        <span>▣</span> Inventory
      </a>
      <a href="/opportunities" :class="{ 'active': currentPage === 'ops' }" @click.prevent="navigateTo('/opportunities')">
        <span>◇</span> Opportunities
      </a>
      <a href="/repricing" :class="{ 'active': currentPage === 'repricing' }" @click.prevent="navigateTo('/repricing')">
        <span>△</span> Repricing Queue
      </a>
      <a href="/soldcards" :class="{ 'active': currentPage === 'sold' }" @click.prevent="navigateTo('/soldcards')">
        <span>◻</span> Sold Cards
      </a>
      <a href="/reports" :class="{ 'active': currentPage === 'reports' }" @click.prevent="navigateTo('/reports')">
        <span>◻</span> Reports
      </a>
    </nav>
    <div class="spacer"></div>
    <div class="sidebar-footer">
      <button id="run-btn" class="btn" :class="{ 'running': schedulerState === 'running' }"
              @click="runScheduler()" :disabled="schedulerState === 'running'">
        <template x-if="schedulerState === 'running'">
          <span class="spinner"></span>
        </template>
        <template x-if="schedulerState !== 'running'">
          <span>Run Scheduler</span>
        </template>
      </button>
      <p x-show="schedulerState === 'done'" style="font-size:11px;color:var(--green);margin:4px 0 0;text-align:center;">Done!</p>
      <p x-show="schedulerState === 'error'" style="font-size:11px;color:var(--red);margin:4px 0 0;text-align:center;" x-text="errorMessage"></p>
    </div>
  </aside>

  <!-- Main content area -->
  <div class="content">
    <!-- Topbar -->
    <div class="topbar">
      <h1 x-text="pageTitle">Dashboard</h1>
      <div class="topbar-meta" x-text="pageMeta"></div>
    </div>

    <!-- Dynamic content -->
    <main class="main" id="content" x-html="pageContent">
    </main>
  </div>

  <script>
    window._agGrids = [];
    window._agGridById = {};

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function idr(value) {
      if (value == null || value === '') return '-';
      var number = Number(value);
      if (!Number.isFinite(number)) return '-';
      return 'Rp ' + Math.round(number).toLocaleString('id-ID');
    }

    function pct(value) {
      if (value == null || value === '') return '-';
      var number = Number(value);
      if (!Number.isFinite(number)) return '-';
      return (number > 0 ? '+' : '') + number.toFixed(1) + '%';
    }

    function badgeHtml(label, tone) {
      var safeTone = tone || 'neutral';
      return '<span class="status-badge status-badge--' + safeTone + '">' + escapeHtml(label || '-') + '</span>';
    }

    function trendClass(value) {
      var number = Number(value);
      if (!Number.isFinite(number) || number === 0) return 'flat';
      return number > 0 ? 'up' : 'down';
    }

    var agRenderers = {
      cardLink: function(params) {
        var title = params.value || '-';
        var slug = params.data && params.data.slug;
        if (!slug) return escapeHtml(title);
        return '<a class="table-title" href="/cards/' + encodeURIComponent(slug) + '">' + escapeHtml(title) + '</a>';
      },
      opportunityLink: function(params) {
        var title = params.value || '-';
        var slug = params.data && params.data.slug;
        if (!slug) return escapeHtml(title);
        return '<a class="table-title" href="/opportunities/' + encodeURIComponent(slug) + '">' + escapeHtml(title) + '</a>';
      },
      externalLink: function(params) {
        var title = params.value || '-';
        var url = params.data && params.data.url;
        if (!url) return escapeHtml(title);
        return '<a class="table-title" href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(title) + '</a>';
      },
      alertBadge: function(params) {
        var level = params.value || 'none';
        var label = (params.data && params.data.alert_label) || 'Aligned';
        if (level === 'red') return badgeHtml(label || 'Price too high', 'danger');
        if (level === 'amber') return badgeHtml(label || 'Price a bit high', 'warning');
        return badgeHtml(label || 'Aligned', 'muted');
      },
      badgeDanger: function(params) {
        return badgeHtml(params.value || 'error', 'danger');
      },
      sourceBadge: function(params) {
        return badgeHtml(String(params.value || '-').replace(/_/g, ' '), 'neutral');
      },
      statusBadge: function(params) {
        var status = String(params.value || '-');
        var normalized = status.toLowerCase();
        var tone = normalized === 'converted' || normalized === 'active' || normalized === 'listed' ? 'success'
          : normalized === 'sold' ? 'danger'
          : normalized === 'owned' || normalized === 'open' ? 'warning'
          : 'neutral';
        return badgeHtml(status, tone);
      },
      decisionBadge: function(params) {
        var used = params.data && params.data.used;
        return badgeHtml(params.value || (used ? 'Used' : 'Filtered'), used ? 'success' : 'muted');
      },
      actionBadge: function(params) {
        var action = params.value || 'Aligned';
        if (action === 'Lower price') return badgeHtml(action, 'danger');
        if (action === 'Raise price') return badgeHtml(action, 'warning');
        if (action === 'Missing market data') return badgeHtml(action, 'muted');
        return badgeHtml(action, 'success');
      },
      moneyValue: function(params) {
        var value = idr(params.value);
        var className = value === '-' ? 'table-muted' : 'table-money';
        return '<span class="' + className + '">' + escapeHtml(value) + '</span>';
      },
      suggestedMoney: function(params) {
        if (params.value == null || params.value === '') {
          return '<span class="table-muted">Insufficient market data</span>';
        }
        return agRenderers.moneyValue(params);
      },
      percentValue: function(params) {
        var number = Number(params.value);
        var tone = !Number.isFinite(number) || number === 0 ? 'neutral' : number > 0 ? 'positive' : 'negative';
        return '<span class="table-percent table-percent--' + tone + '">' + escapeHtml(pct(params.value)) + '</span>';
      },
      trend: function(params) {
        return '<span class="trend trend--' + trendClass(params.value) + '">' + escapeHtml(pct(params.value)) + '</span>';
      }
    };

    var agFormatters = {
      idr: function(params) { return idr(params.value); },
      pct: function(params) { return pct(params.value); }
    };

    function buildColumnDefs(rawColumns) {
      return rawColumns.map(function(column) {
        var next = Object.assign({}, column);
        if (typeof next.cellRenderer === 'string') {
          next.cellRenderer = agRenderers[next.cellRenderer] || undefined;
        }
        if (typeof next.valueFormatter === 'string') {
          next.valueFormatter = agFormatters[next.valueFormatter] || undefined;
        }
        delete next.alwaysRender;
        next.sortable = next.sortable !== false;
        next.filter = next.filter !== false;
        next.resizable = next.resizable !== false;
        return next;
      });
    }

    function destroyAgGrids() {
      (window._agGrids || []).forEach(function(api) {
        if (api && typeof api.destroy === 'function') api.destroy();
      });
      window._agGrids = [];
      window._agGridById = {};
    }

    function getGridApi(gridId) {
      return window._agGridById && window._agGridById[gridId];
    }

    function filterRepricing(action) {
      var api = getGridApi('repricing-table');
      if (!api) return;
      api.setFilterModel(action ? {
        recommended_action: {
          type: 'equals',
          filter: action
        }
      } : null);
      if (typeof api.onFilterChanged === 'function') api.onFilterChanged();
    }

    function sortRepricing(mode) {
      var api = getGridApi('repricing-table');
      if (!api) return;
      var sortModel = [];
      if (mode === 'delta_desc') sortModel = [{ colId: 'delta_percent', sort: 'desc' }];
      if (mode === 'delta_asc') sortModel = [{ colId: 'delta_percent', sort: 'asc' }];
      if (mode === 'tokopedia_desc') sortModel = [{ colId: 'tokopedia_price', sort: 'desc' }];
      if (mode === 'market_desc') sortModel = [{ colId: 'market_avg_price', sort: 'desc' }];
      if (typeof api.applyColumnState === 'function') {
        api.applyColumnState({
          defaultState: { sort: null },
          state: sortModel,
        });
      }
    }

    function resolveAgTheme() {
      if (!window.agGrid || !window.agGrid.themeQuartz || !window.agGrid.colorSchemeDarkBlue) {
        return null;
      }
      if (typeof window.agGrid.themeQuartz.withPart !== 'function') {
        return null;
      }
      return window.agGrid.themeQuartz.withPart(window.agGrid.colorSchemeDarkBlue);
    }

    function initAgGrids(root) {
      var scope = root || document;
      var hosts = scope.querySelectorAll('.ag-grid-host[data-columns][data-rows]');
      hosts.forEach(function(host) {
        if (!window.agGrid || typeof window.agGrid.createGrid !== 'function') {
          host.innerHTML = '<div class="empty-state"><strong>Table failed to load</strong><span>AG Grid assets are unavailable.</span></div>';
          return;
        }
        try {
          var columns = JSON.parse(host.dataset.columns || '[]');
          var rows = JSON.parse(host.dataset.rows || '[]');
          var gridOptions = {
            columnDefs: buildColumnDefs(columns),
            rowData: rows,
            animateRows: true,
            pagination: rows.length > 12,
            paginationPageSize: 12,
            paginationPageSizeSelector: [12, 25, 50, 100],
            suppressCellFocus: true,
            enableCellTextSelection: true,
            domLayout: rows.length <= 6 ? 'autoHeight' : 'normal',
            autoSizeStrategy: {
              type: 'fitGridWidth'
            },
            defaultColDef: {
              flex: 1,
              minWidth: 140,
              resizable: true,
              sortable: true,
              filter: true,
              wrapText: true,
              autoHeight: true
            }
          };
          var theme = resolveAgTheme();
          if (theme) gridOptions.theme = theme;
          var gridApi = window.agGrid.createGrid(host, gridOptions);
          window._agGrids.push(gridApi);
          if (host.dataset.gridId) window._agGridById[host.dataset.gridId] = gridApi;
          if (gridApi && typeof gridApi.sizeColumnsToFit === 'function') {
            requestAnimationFrame(function() {
              gridApi.sizeColumnsToFit();
            });
          }
        } catch (error) {
          console.error('AG Grid init failed:', error);
          host.innerHTML = '<div class="empty-state"><strong>Table failed to load</strong><span>' + escapeHtml(error.message) + '</span></div>';
        }
      });
    }

    function app() {
      return {
        currentPage: 'dash',
        pageTitle: 'Dashboard',
        pageMeta: '',
        pageContent: '',
        schedulerState: 'idle',
        errorMessage: '',

        setPage(page) {
          this.currentPage = page;
          if (page === 'dash') {
            this.pageTitle = 'Dashboard';
            this.pageMeta = 'Portfolio overview across your active Tokopedia listings.';
          } else if (page === 'cards') {
            this.pageTitle = 'Store Listings';
            this.pageMeta = 'Tokopedia listing prices, market averages, alerts, and store sync.';
          } else if (page === 'repricing') {
            this.pageTitle = 'Repricing Queue';
            this.pageMeta = 'Cards that need Tokopedia price action.';
          } else if (page === 'ops') {
            this.pageTitle = 'Buying Opportunities';
            this.pageMeta = 'Buy-list cards before they become owned inventory or active listings.';
          } else if (page === 'inventory') {
            this.pageTitle = 'Owned Inventory';
            this.pageMeta = 'Owned cards from buy-list conversions and listing lifecycles.';
          } else if (page === 'reports') {
            this.pageTitle = 'Reports';
            this.pageMeta = 'Markdown report from last run.';
          } else if (page === 'sold') {
            this.pageTitle = 'Sold Cards';
            this.pageMeta = 'Cards that have been sold or delisted from Tokopedia.';
          }
        },

        navigateTo(path, pushState) {
          if (pushState !== false && window.location.pathname !== path) {
            history.pushState({ path: path }, '', path);
          }
          var url = '/api/dashboard';
          if (path === '/cards') {
            this.setPage('cards');
            url = '/api/cards';
          } else if (path === '/opportunities') {
            this.setPage('ops');
            url = '/api/opportunities';
          } else if (path === '/inventory') {
            this.setPage('inventory');
            url = '/api/inventory';
          } else if (path === '/repricing') {
            this.setPage('repricing');
            url = '/api/repricing';
          } else if (path === '/soldcards') {
            this.setPage('sold');
            url = '/api/soldcards';
          } else if (path.startsWith('/cards/')) {
            this.currentPage = 'card-detail';
            this.pageTitle = 'Card Detail';
            this.pageMeta = 'Loading...';
            url = '/api/cards/' + path.replace('/cards/', '');
          } else if (path.startsWith('/opportunities/')) {
            this.currentPage = 'opportunity-detail';
            this.pageTitle = 'Opportunity Detail';
            this.pageMeta = 'Buy-list source, pricing, and conversion workflow.';
            url = '/api/opportunities/' + path.replace('/opportunities/', '');
          } else {
            this.setPage('dash');
          }

          var self = this;
          destroyAgGrids();
          this.pageContent = '<p id="loading-msg">LOADING: ' + url + '</p>';
          console.log('Set loading:', url);
          fetch(url)
            .then(function(r) { return r.text(); })
            .then(function(html) {
              console.log('Fetched content length:', html.length);
              destroyAgGrids();
              self.pageContent = html;
              if (self.currentPage === 'card-detail') self.pageMeta = 'Pricing evidence, run health, and source observations.';
              requestAnimationFrame(function() {
                initAgGrids(document.getElementById('content'));
              });
            })
            .catch(function(e) {
              console.error('Fetch error:', e);
              self.pageContent = '<p>Error loading: ' + url + '</p>';
            });
        },

        init() {
          window.__INIT_CALLED = true;
          window._app = this;
          var path = window.location.pathname;
          this.navigateTo(path, false);
          var self = this;
          window.addEventListener('popstate', function(event) {
            self.navigateTo((event.state && event.state.path) || window.location.pathname, false);
          });
          document.addEventListener('click', function(event) {
            var link = event.target.closest('a[href^="/cards/"], a[href^="/opportunities/"]');
            if (!link || link.target === '_blank') return;
            event.preventDefault();
            self.navigateTo(link.getAttribute('href'));
          });
        },

        async runScheduler() {
          if (this.schedulerState === 'running') return;
          this.schedulerState = 'running';
          this.errorMessage = '';

          try {
            var res = await fetch('/run', { method: 'POST' });
            var data = await res.json();
            if (!data.ok) {
              this.schedulerState = 'error';
              this.errorMessage = data.error || 'Unknown error';
              return;
            }

            var evtSource = new EventSource('/run/status');
            var self = this;
            evtSource.onmessage = function(event) {
              var status = event.data;
              if (status === 'done') {
                evtSource.close();
                self.schedulerState = 'done';
                self.navigateTo(window.location.pathname);
              } else if (status === 'error') {
                evtSource.close();
                self.schedulerState = 'error';
                self.errorMessage = 'Scheduler failed';
              }
            };
            evtSource.onerror = function() {
              evtSource.close();
              self.schedulerState = 'idle';
            };
          } catch(e) {
            this.schedulerState = 'error';
            this.errorMessage = e.message;
          }
        },

        refreshCard(slug) {
          if (window._refreshing) return;
          window._refreshing = slug;
          var btn = document.getElementById('refresh-btn');
          var btnText = document.getElementById('refresh-btn-text');
          if (btn) btn.disabled = true;
          if (btn) btn.classList.add('running');
          if (btnText) btnText.innerHTML = '<span class="spinner"></span> Refreshing…';
          fetch('/run/' + slug, { method: 'POST' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
              if (!data.ok) {
                window._refreshing = null;
                if (btn) btn.disabled = false;
                if (btn) btn.classList.remove('running');
                if (btnText) btnText.textContent = 'Refresh Prices';
                showToast(data.error || 'Refresh failed', 'error');
                return;
              }
              var pollInterval = setInterval(function() {
                fetch('/run/' + slug + '/status')
                  .then(function(r) { return r.json(); })
                  .then(function(status) {
                    if (status.state === 'done') {
                      clearInterval(pollInterval);
                      window._refreshing = null;
                      showToast('Prices refreshed', 'ok');
                      window.location.href = '/cards/' + slug;
                    } else if (status.state === 'error') {
                      clearInterval(pollInterval);
                      window._refreshing = null;
                      if (btn) btn.disabled = false;
                      if (btn) btn.classList.remove('running');
                      if (btnText) btnText.textContent = 'Refresh Prices';
                      showToast('Refresh failed', 'error');
                    }
                  })
                  .catch(function() {
                    clearInterval(pollInterval);
                    window._refreshing = null;
                    if (btn) btn.disabled = false;
                    if (btn) btn.classList.remove('running');
                    if (btnText) btnText.textContent = 'Refresh Prices';
                    showToast('Refresh failed', 'error');
                  });
              }, 1000);
            })
            .catch(function() {
              window._refreshing = null;
              if (btn) btn.disabled = false;
              if (btn) btn.classList.remove('running');
              if (btnText) btnText.textContent = 'Refresh Prices';
              showToast('Refresh failed', 'error');
            });
        }
      };
    }

    window._app = null;
    window.refreshCard = function(slug) {
      if (window._app) window._app.refreshCard(slug);
    };

    function openAddCardModal() {
      document.getElementById('add-card-modal').classList.add('open');
    }

    function closeAddCardModal() {
      document.getElementById('add-card-modal').classList.remove('open');
    }

    function openOpportunityModal() {
      document.getElementById('opp-card-name').value = '';
      document.getElementById('opp-card-rarity').value = '';
      document.getElementById('opp-card-language').value = '';
      document.getElementById('opp-source').value = '';
      document.getElementById('opp-link').value = '';
      document.getElementById('opp-price').value = '';
      document.getElementById('opportunity-modal').classList.add('open');
    }

    function closeOpportunityModal() {
      document.getElementById('opportunity-modal').classList.remove('open');
    }

    async function submitOpportunity() {
      var payload = {
        card_name: document.getElementById('opp-card-name').value.trim(),
        card_rarity: document.getElementById('opp-card-rarity').value.trim(),
        card_language: document.getElementById('opp-card-language').value.trim(),
        source: document.getElementById('opp-source').value.trim(),
        link: document.getElementById('opp-link').value.trim(),
        price_idr: document.getElementById('opp-price').value.trim()
      };
      if (!payload.card_name || !payload.card_rarity || !payload.card_language || !payload.source || !payload.link || !payload.price_idr) {
        showToast('All opportunity fields are required', 'error');
        return;
      }
      var res = await fetch('/api/opportunities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var data = await res.json();
      if (!data.ok) {
        showToast(data.error || 'Failed to add opportunity', 'error');
        return;
      }
      closeOpportunityModal();
      window._app.navigateTo('/opportunities/' + data.slug);
    }

    function openConvertOpportunityModal(slug, price) {
      document.getElementById('convert-opportunity-slug').value = slug || '';
      document.getElementById('convert-bought-price').value = price || '';
      document.getElementById('convert-tokopedia-url').value = '';
      document.getElementById('convert-listing-price').value = '';
      document.getElementById('convert-opportunity-modal').classList.add('open');
    }

    function closeConvertOpportunityModal() {
      document.getElementById('convert-opportunity-modal').classList.remove('open');
    }

    async function submitConvertOpportunity() {
      var slug = document.getElementById('convert-opportunity-slug').value;
      var payload = {
        bought_at_price_idr: document.getElementById('convert-bought-price').value.trim(),
        tokopedia_url: document.getElementById('convert-tokopedia-url').value.trim(),
        listing_price_idr: document.getElementById('convert-listing-price').value.trim()
      };
      if (!slug || !payload.bought_at_price_idr) {
        showToast('Bought price is required', 'error');
        return;
      }
      var res = await fetch('/api/opportunities/' + encodeURIComponent(slug) + '/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var data = await res.json();
      if (!data.ok) {
        showToast(data.error || 'Failed to convert opportunity', 'error');
        return;
      }
      closeConvertOpportunityModal();
      showToast(data.created_listing ? 'Converted and listed' : 'Converted to inventory', 'ok');
      window._app.navigateTo('/inventory');
    }

    function openMarkSoldModal(slug) {
      document.getElementById('mark-sold-slug').value = slug || '';
      document.getElementById('mark-sold-mode').value = 'mark';
      document.getElementById('mark-sold-title').textContent = 'Mark Sold';
      document.getElementById('mark-sold-submit').textContent = 'Mark Sold';
      document.getElementById('sold-date-input').value = new Date().toISOString().slice(0, 10);
      document.getElementById('sold-price-input').value = '';
      document.getElementById('bought-price-input').value = '';
      document.getElementById('net-income-input').value = '';
      document.getElementById('mark-sold-modal').classList.add('open');
    }

    function openEditSaleModal(slug, soldAt, soldPrice, boughtPrice, netIncome) {
      document.getElementById('mark-sold-slug').value = slug || '';
      document.getElementById('mark-sold-mode').value = 'edit';
      document.getElementById('mark-sold-title').textContent = 'Edit Sale';
      document.getElementById('mark-sold-submit').textContent = 'Save Sale';
      document.getElementById('sold-date-input').value = soldAt || new Date().toISOString().slice(0, 10);
      document.getElementById('sold-price-input').value = soldPrice || '';
      document.getElementById('bought-price-input').value = boughtPrice || '';
      document.getElementById('net-income-input').value = netIncome || '';
      document.getElementById('mark-sold-modal').classList.add('open');
    }

    function closeMarkSoldModal() {
      document.getElementById('mark-sold-modal').classList.remove('open');
    }

    async function submitMarkSold() {
      var slug = document.getElementById('mark-sold-slug').value;
      var mode = document.getElementById('mark-sold-mode').value || 'mark';
      var soldAt = document.getElementById('sold-date-input').value;
      var soldPrice = document.getElementById('sold-price-input').value;
      var boughtPrice = document.getElementById('bought-price-input').value;
      var netIncome = document.getElementById('net-income-input').value;
      if (!slug || !soldAt || !soldPrice || !boughtPrice || !netIncome) {
        showToast('Sold date, sold price, bought price, and net income are required', 'error');
        return;
      }
      var endpoint = mode === 'edit' ? '/sale-details' : '/mark-sold';
      var res = await fetch('/api/cards/' + encodeURIComponent(slug) + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sold_at: soldAt, sold_price_idr: soldPrice, bought_at_price_idr: boughtPrice, net_income_idr: netIncome })
      });
      var data = await res.json();
      if (!data.ok) {
        showToast(data.error || 'Failed to mark sold', 'error');
        return;
      }
      closeMarkSoldModal();
      showToast((mode === 'edit' ? 'Sale updated: ' : 'Marked sold: ') + data.title, 'ok');
      window._app.navigateTo('/soldcards');
    }

    async function submitAddCard() {
      var tokopediaUrl = document.getElementById('new-card-url').value.trim();
      var searchKeyword = document.getElementById('new-card-keyword').value.trim();
      if (!tokopediaUrl) {
        showToast('Tokopedia URL is required', 'error');
        return;
      }
      var res = await fetch('/api/cards/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tokopedia_url: tokopediaUrl, search_keyword: searchKeyword })
      });
      var data = await res.json();
      if (!data.ok) {
        showToast(data.error || 'Failed to add card', 'error');
        return;
      }
      closeAddCardModal();
      window.location.href = '/cards/' + data.slug;
    }

    async function updateSearchTerm(slug) {
      var input = document.getElementById('search-term-input');
      if (!input) return;
      var searchTerm = input.value.trim();
      var res = await fetch('/api/cards/' + slug + '/search-term', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ search_term: searchTerm })
      });
      showToast(res.ok ? 'Search term updated' : 'Failed to update search term', res.ok ? 'ok' : 'error');
    }

    async function updatePrice(slug) {
      var btn = document.getElementById('update-price-btn');
      var original = btn ? btn.textContent : '';
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Syncing...';
      }
      try {
        var res = await fetch('/api/cards/' + slug + '/update-price', { method: 'PUT' });
        var data = await res.json();
        if (!data.ok) {
          showToast(data.error || 'Failed to sync price', 'error');
          return;
        }
        showToast('Store price synced: ' + data.price_display, 'ok');
        window._app.navigateTo('/cards/' + slug, false);
      } catch (e) {
        showToast(e.message || 'Failed to sync price', 'error');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = original || 'Sync Store Price';
        }
      }
    }

    async function syncNewProducts() {
      var res = await fetch('/api/products/sync', { method: 'POST' });
      var data = await res.json();
      if (data.ok) {
        var total = (data.added_count || 0) + (data.updated_count || 0) + (data.sold_count || 0) + (data.deduped_count || 0);
        var parts = [];
        if (data.added_count) parts.push('added ' + data.added_count);
        if (data.updated_count) parts.push('updated ' + data.updated_count);
        if (data.repaired_count) parts.push('repaired ' + data.repaired_count);
        if (data.sold_count) parts.push('sold ' + data.sold_count);
        if (data.deduped_count) parts.push('deduped ' + data.deduped_count);
        showToast(total ? 'Store synced: ' + parts.join(', ') : 'Store synced: no changes', 'ok');
        window._app.navigateTo('/cards');
      } else {
        showToast(data.error || 'Sync failed', 'error');
      }
    }

    async function revertSold(slug) {
      var res = await fetch('/api/cards/' + slug + '/revert-sold', { method: 'PUT' });
      var data = await res.json();
      if (data.ok) {
        showToast('Reverted: ' + data.title + ' is active again', 'ok');
        window._app.navigateTo('/soldcards');
      } else {
        showToast(data.error || 'Failed to revert', 'error');
      }
    }

    var _toastTimer;
    function showToast(message, type) {
      var el = document.getElementById('toast');
      el.textContent = message;
      el.className = 'toast ' + (type || 'ok');
      el.classList.add('visible');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(function() { el.classList.remove('visible'); }, 2500);
    }
  </script>
  <div id="toast" class="toast"></div>
  <div id="add-card-modal" class="modal-overlay" x-data="{}">
    <div class="modal">
      <h2>Add New Card</h2>
      <label>Tokopedia URL</label>
      <input id="new-card-url" type="url" placeholder="https://www.tokopedia.com/...">
      <label>Search Keyword</label>
      <input id="new-card-keyword" type="text" placeholder="Pikachu KFC PROMO PSA 10">
      <div class="modal-actions">
        <button class="btn" onclick="closeAddCardModal()">Cancel</button>
        <button class="btn" onclick="submitAddCard()">Add Card</button>
      </div>
    </div>
  </div>
  <div id="opportunity-modal" class="modal-overlay" x-data="{}">
    <div class="modal">
      <h2>Add Buy List Card</h2>
      <label>Card Name</label>
      <input id="opp-card-name" type="text" placeholder="Lisia's Appeal">
      <label>Card Rarity</label>
      <input id="opp-card-rarity" type="text" placeholder="SAR">
      <label>Card Language</label>
      <input id="opp-card-language" type="text" placeholder="Japanese">
      <label>Source</label>
      <input id="opp-source" type="text" placeholder="Tokopedia seller, eBay, SNKRDUNK">
      <label>Link</label>
      <input id="opp-link" type="url" placeholder="https://...">
      <label>Price</label>
      <input id="opp-price" type="text" inputmode="numeric" placeholder="1500000">
      <div class="modal-actions">
        <button class="btn" onclick="closeOpportunityModal()">Cancel</button>
        <button class="btn" onclick="submitOpportunity()">Add Opportunity</button>
      </div>
    </div>
  </div>
  <div id="convert-opportunity-modal" class="modal-overlay" x-data="{}">
    <div class="modal">
      <h2>Convert Opportunity</h2>
      <input id="convert-opportunity-slug" type="hidden">
      <label>Bought Price</label>
      <input id="convert-bought-price" type="text" inputmode="numeric" placeholder="1500000">
      <label>Tokopedia Listing URL</label>
      <input id="convert-tokopedia-url" type="url" placeholder="Optional, only if already listed">
      <label>Listing Price</label>
      <input id="convert-listing-price" type="text" inputmode="numeric" placeholder="Optional, required with Tokopedia URL">
      <div class="modal-actions">
        <button class="btn" onclick="closeConvertOpportunityModal()">Cancel</button>
        <button class="btn" onclick="submitConvertOpportunity()">Convert</button>
      </div>
    </div>
  </div>
  <div id="mark-sold-modal" class="modal-overlay" x-data="{}">
    <div class="modal">
      <h2 id="mark-sold-title">Mark Sold</h2>
      <input id="mark-sold-slug" type="hidden">
      <input id="mark-sold-mode" type="hidden" value="mark">
      <label>Sold Date</label>
      <input id="sold-date-input" type="date">
      <label>Sold Price</label>
      <input id="sold-price-input" type="text" inputmode="numeric" placeholder="2500000">
      <label>Bought Price</label>
      <input id="bought-price-input" type="text" inputmode="numeric" placeholder="1500000">
      <label>Net Income</label>
      <input id="net-income-input" type="text" inputmode="numeric" placeholder="2200000">
      <div class="modal-actions">
        <button class="btn" onclick="closeMarkSoldModal()">Cancel</button>
        <button id="mark-sold-submit" class="btn" onclick="submitMarkSold()">Mark Sold</button>
      </div>
    </div>
  </div>
</body>
