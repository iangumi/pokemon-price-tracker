<html lang="en" class="dark">
<head>

  <script src="/vendor/ag-grid/ag-grid-community.min.js"></script>
  <style>
    :root {
      --case: #d8d3b7;
      --case-dark: #9d987d;
      --paper: #f0ebcc;
      --lcd: #a9bd68;
      --lcd-light: #c7d88a;
      --lcd-dark: #6d7f3d;
      --ink: #182313;
      --ink-soft: #314021;
      --shadow: #4d5633;
      --button: #7b3f73;
      --button-dark: #4f244b;
      --bg: #141a12;
      --surface: var(--lcd);
      --surface-2: var(--lcd-light);
      --surface-3: #d8e69d;
      --border: var(--ink);
      --text: var(--ink);
      --muted: var(--ink-soft);
      --accent: var(--button);
      --accent-h: #9c5794;
      --green: #245b2d;
      --amber: #8d6512;
      --red: #8b1e24;
      --blue: #22526a;
      --grid: rgba(24, 35, 19, 0.12);
      --font-display: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --font-body: Inter, system-ui, sans-serif;
      --sp-1: 8px;
      --sp-2: 16px;
      --sp-3: 24px;
      --sp-4: 32px;
      --radius-sm: 0;
      --radius-md: 0;
      --radius-lg: 0;
      --motion-fast: 120ms ease;
      --sidebar-w: 232px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      color: var(--ink);
      font-family: var(--font-body);
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        var(--bg);
      background-size: 18px 18px;
      border: 10px solid #0a0f08;
      -webkit-font-smoothing: none;
    }
    a { color: var(--ink); text-decoration: none; }
    a:hover { color: var(--button); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--case-dark); }
    ::-webkit-scrollbar-thumb { background: var(--ink); }

    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      height: calc(100vh - 20px);
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      gap: 18px;
      overflow-y: auto;
      padding: 24px 18px;
      background: #c9c39e;
      border-right: 4px solid var(--ink);
      box-shadow: inset -6px 0 0 rgba(24, 35, 19, 0.18);
    }
    .sidebar-brand {
      padding: 14px;
      border: 3px solid var(--ink);
      background: var(--lcd);
      box-shadow: 4px 4px 0 var(--shadow);
      font-family: var(--font-display);
      text-transform: uppercase;
    }
    .sidebar-brand h1 {
      margin: 0;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.06em;
    }
    .sidebar-brand span {
      display: block;
      margin-top: 6px;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .sidebar-section-label {
      margin-bottom: -8px;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .sidebar nav {
      display: grid;
      gap: 8px;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 36px;
      width: 100%;
      padding: 8px 10px;
      border: 2px solid var(--ink);
      color: var(--ink);
      background: #eee9c7;
      box-shadow: 3px 3px 0 var(--shadow);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 900;
      text-align: left;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform var(--motion-fast), box-shadow var(--motion-fast);
    }
    .sidebar nav a:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 var(--shadow); }
    .sidebar nav a.active {
      color: var(--lcd-light);
      background: var(--ink);
      box-shadow: 3px 3px 0 var(--button);
    }
    .nav-icon,
    .ui-icon {
      display: inline-flex;
      width: 18px;
      height: 18px;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .nav-icon svg,
    .ui-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .sidebar .spacer { flex: 1; }
    .sidebar-footer {
      padding: 12px;
      border: 3px solid var(--ink);
      background: #eee9c7;
      box-shadow: 4px 4px 0 var(--shadow);
    }
    .sidebar-footer .btn { width: 100%; text-align: center; }
    .sidebar-footer p {
      font-family: var(--font-display);
      font-size: 10px !important;
      text-transform: uppercase;
    }

    .app { display: flex; flex: 1; min-height: 100vh; }
    .content {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #e6dfbb;
    }
    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 18px 28px;
      border-bottom: 4px solid var(--ink);

    }
    .topbar h1 {
      margin: 0;
      flex: 1;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.08em;
      text-transform: uppercase;
    }
    .topbar-meta {
      color: var(--ink-soft);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 900;
      text-align: right;
      text-transform: uppercase;
    }
    .main {
      flex: 1;
      width: 100%;
      max-width: none;
      overflow-y: auto;
      display: block;
      padding: 22px;
      background: #e6dfbb;
    }
    #content, .cards-page { width: 100%; max-width: none; box-sizing: border-box; }

    .btn {
      min-height: 36px;
      border: 3px solid var(--ink);
      border-radius: 0;
      padding: 7px 14px;
      color: #fff7d6;
      background: var(--button);
      box-shadow: inset -3px -3px 0 var(--button-dark), 2px 2px 0 var(--shadow);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      transition: transform var(--motion-fast), box-shadow var(--motion-fast);
    }
    .btn:hover { transform: translate(1px, 1px); box-shadow: inset -3px -3px 0 var(--button-dark), 1px 1px 0 var(--shadow); }
    .btn:active { transform: translate(2px, 2px); box-shadow: inset -2px -2px 0 var(--button-dark); }
    .btn:disabled { opacity: .65; cursor: not-allowed; transform: none; }
    .btn.running { background: var(--amber); }
    .btn--primary, .btn { background: var(--button); color: #fff7d6; }
    .btn--secondary {
      color: var(--ink);
      background: #eee9c7;
      box-shadow: 2px 2px 0 var(--shadow);
    }
    .btn--secondary:hover { color: var(--ink); background: var(--lcd-light); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: var(--sp-2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 3px solid var(--ink);
      background: rgba(199, 216, 138, 0.78);
      color: var(--ink);
    }
    th {
      padding: 10px var(--sp-2);
      border-bottom: 3px solid var(--ink);
      color: #000;
      background: var(--lcd-light);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-align: left;
      text-transform: uppercase;
      white-space: nowrap;
    }
    td {
      padding: 10px var(--sp-2);
      border-bottom: 1px solid rgba(24, 35, 19, 0.35);
      color: var(--ink);
      font-size: 13px;
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: rgba(24, 35, 19, 0.08); }
    tr.alert-red td { background: rgba(139, 30, 36, 0.15); }
    tr.alert-amber td { background: rgba(141, 101, 18, 0.16); }

    .metric-grid, .metrics, .dashboard-kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: var(--sp-3);
    }
    .metric-card, .kpi-card, .metrics > div {
      min-height: 108px;
      padding: 12px;
      border: 3px solid var(--ink);
      border-radius: 0;
      background: rgba(199, 216, 138, 0.62);
      box-shadow: inset -4px -4px 0 rgba(24, 35, 19, 0.12);
    }
    .metric-card--success { box-shadow: inset -4px -4px 0 rgba(36, 91, 45, 0.18); }
    .metric-card--danger { box-shadow: inset -4px -4px 0 rgba(139, 30, 36, 0.18); }
    .metric-card--warning { box-shadow: inset -4px -4px 0 rgba(141, 101, 18, 0.18); }
    .metric-label, .kpi-label, .metrics span {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      color: var(--ink-soft);
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .metric-value, .kpi-value, .metrics strong {
      display: block;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: clamp(20px, 2.4vw, 30px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.08em;
      overflow-wrap: anywhere;
    }
    .metric-hint, .kpi-hint {
      display: block;
      margin-top: 8px;
      color: var(--ink-soft);
      font-family: var(--font-display);
      font-size: 10px;
      line-height: 1.45;
      text-transform: uppercase;
    }
    .live-store-signals .metric-grid {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      margin-bottom: 0;
    }
    .dashboard-preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--sp-3);
      align-items: start;
    }
    .dashboard-preview-panel { min-width: 0; }
    .dashboard-preview-table {
      width: 100%;
      overflow-x: auto;
      border: 3px solid var(--ink);
      background: rgba(199, 216, 138, 0.78);
    }
    .dashboard-preview-table table {
      border: 0;
      min-width: 0;
      table-layout: fixed;
    }
    .dashboard-preview-table th,
    .dashboard-preview-table td {
      overflow: hidden;
      padding: 8px 10px;
      font-family: var(--font-display);
      font-size: 10px;
      text-overflow: ellipsis;
    }
    .dashboard-preview-table .table-title {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dashboard-preview-table th:first-child,
    .dashboard-preview-table td:first-child { width: 42%; }
    .dashboard-preview-table th:not(:first-child),
    .dashboard-preview-table td:not(:first-child) { width: auto; }
    .dashboard-preview-table .status-badge {
      max-width: 100%;
      overflow: hidden;
      padding-inline: 6px;
      text-overflow: ellipsis;
    }
    .dashboard-preview-panel .toolbar {
      justify-content: flex-start;
      margin: 12px 0 0;
    }

    .panel {
      position: relative;
      overflow: hidden;
      margin-bottom: var(--sp-3);
      padding: 16px;
      border: 4px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      background:
        repeating-linear-gradient(to bottom, rgba(24, 35, 19, 0.06) 0, rgba(24, 35, 19, 0.06) 2px, transparent 2px, transparent 5px),
        var(--lcd);
      box-shadow: 6px 6px 0 var(--shadow);
    }
    .panel::after {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 28%);
      mix-blend-mode: screen;
    }
    .panel > * { position: relative; z-index: 1; }
    .panel-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--sp-2);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 3px double rgba(24, 35, 19, 0.65);
    }
    h2, .panel-header h2 {
      margin: 0;
      padding: 0;
      border: 0;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    .panel-subtitle {
      margin: 0;
      max-width: 520px;
      color: var(--ink-soft);
      font-family: var(--font-display);
      font-size: 10px;
      text-align: right;
      text-transform: uppercase;
    }

    .table-shell {
      width: 100%;
      max-width: none;
      overflow-x: auto;
      border: 3px solid var(--ink);
      border-radius: 0;
      background: rgba(199, 216, 138, 0.78);
      box-sizing: border-box;
    }
    .grid-shell { min-height: 360px; padding: 0; width: 100%; max-width: none; box-sizing: border-box; }
    .ag-grid-host {
      width: 100%;
      max-width: none;
      height: 420px;
      min-width: 0;
      border-radius: 0;
      box-sizing: border-box;
      --ag-background-color: rgba(199, 216, 138, 0.78);
      --ag-foreground-color: var(--ink);
      --ag-data-color: var(--ink);
      --ag-secondary-foreground-color: var(--ink-soft);
      --ag-header-background-color: var(--lcd-light);
      --ag-header-foreground-color: #000;
      --ag-border-color: rgba(24, 35, 19, 0.55);
      --ag-row-border-color: rgba(24, 35, 19, 0.35);
      --ag-odd-row-background-color: rgba(109, 127, 61, 0.14);
      --ag-row-hover-color: rgba(24, 35, 19, 0.16);
      --ag-selected-row-background-color: rgba(123, 63, 115, 0.22);
      --ag-control-panel-background-color: var(--lcd-light);
      --ag-subheader-background-color: var(--lcd-light);
      --ag-input-background-color: #eee9c7;
      --ag-input-text-color: var(--ink);
      --ag-modal-overlay-background-color: rgba(24, 35, 19, 0.55);
      --ag-font-family: var(--font-display);
      --ag-font-size: 12px;
      color: var(--ink);
    }
    .ag-grid-host.ag-theme-quartz,
    .ag-grid-host.ag-theme-quartz .ag-root-wrapper,
    .ag-grid-host.ag-theme-quartz .ag-root,
    .ag-grid-host.ag-theme-quartz .ag-body,
    .ag-grid-host.ag-theme-quartz .ag-body-viewport,
    .ag-grid-host.ag-theme-quartz .ag-center-cols-viewport,
    .ag-grid-host.ag-theme-quartz .ag-center-cols-container,
    .ag-grid-host.ag-theme-quartz .ag-row,
    .ag-grid-host.ag-theme-quartz .ag-paging-panel {
      background: rgba(199, 216, 138, 0.78) !important;
      color: var(--ink) !important;
    }
    .ag-grid-host.ag-theme-quartz .ag-header,
    .ag-grid-host.ag-theme-quartz .ag-header-row,
    .ag-grid-host.ag-theme-quartz .ag-header-cell {
      background: var(--lcd-light) !important;
      color: #000 !important;
    }
    .ag-grid-host.ag-theme-quartz .ag-header-cell-text {
      color: #000 !important;
    }
    .ag-grid-host.ag-theme-quartz .ag-cell {
      color: var(--ink) !important;
      line-height: 1.35;
      padding-top: 8px;
      padding-bottom: 8px;
    }
    .cards-page .cards-data-grid.grid-shell { height: calc(100vh - 260px); min-height: 520px; }
    .cards-page .cards-data-grid .ag-grid-host,
    .cards-page .cards-data-grid.ag-grid-host { width: 100%; max-width: none; height: 100%; min-height: 520px; }
    .data-table--compact .ag-grid-host { height: 320px; }
    .ag-cell { display: flex; align-items: center; color: var(--ink); }
    .ag-header-cell-text {
      color: #000;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .table-title,
    .cards-page .cards-data-grid a,
    .cards-page .cards-data-grid .table-title {
      display: block;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 900;
      line-height: 1.35;
      text-decoration: none;
      text-transform: uppercase;
    }
    .cards-page .cards-data-grid .table-title {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .table-title:hover,
    .cards-page .cards-data-grid a:hover,
    .cards-page .cards-data-grid .table-title:hover { color: var(--button); text-decoration: underline; }
    .table-subtitle, .table-muted {
      display: block;
      color: var(--ink-soft);
      font-family: var(--font-display);
      font-size: 10px;

    }
    .table-money { color: var(--ink); font-weight: 900; letter-spacing: .01em; }
    .table-percent { font-weight: 900; }
    .table-percent--positive { color: var(--red); }
    .table-percent--negative { color: var(--green); }
    .table-percent--neutral { color: var(--ink-soft); }

    .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .status-dot.ok { background: var(--green); }
    .status-dot.warn { background: var(--amber); }
    .status-dot.danger { background: var(--red); }
    .status-dot.none { background: var(--ink-soft); }
    .status-badge, .alert-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 24px;
      padding: 3px 9px;
      border: 2px solid var(--ink);
      border-radius: 0;
      color: #fff7d6;
      background: var(--ink);
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .status-badge--success { background: var(--green); color: #fff7d6; }
    .status-badge--danger, .alert-badge.red { background: var(--red); color: #fff7d6; }
    .status-badge--warning, .alert-badge.amber { background: var(--amber); color: #fff7d6; }
    .status-badge--neutral { background: var(--button); color: #fff7d6; }

    .repricing-controls { display: grid; gap: 12px; margin-bottom: var(--sp-2); }
    .control-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .control-label {

      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    dl, .identity-list {

      grid-template-columns: minmax(110px, 170px) 1fr;
      gap: 0 var(--sp-2);
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
    }
    dt, dd { padding: 7px 0; border-bottom: 1px solid rgba(24, 35, 19, 0.35); font-size: 13px; }
    dt { color: var(--ink-soft); font-family: var(--font-display); font-weight: 900; text-transform: uppercase; }
    dd { margin: 0; color: var(--ink); }
    dl > :last-child { border-bottom: none; }

    .identity-layout {
      display: grid;
      grid-template-columns: minmax(180px, 30%) minmax(0, 70%);
      gap: var(--sp-3);
      align-items: start;
    }
    .identity-picture-block,
    .identity-detail-block {
      min-width: 0;

      place-items: center;
      text-align: center;
    }

      display: grid;
      grid-template-columns: 140px 1fr;
      gap: var(--sp-2);
      align-items: start;
      margin-bottom: var(--sp-3);

      border: 3px solid var(--ink);
      background: rgba(199, 216, 138, 0.62);

      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .09em;
      padding-top: 10px;
      text-transform: uppercase;
    }
    .field-control { display: flex; gap: 10px; align-items: center; }
    .input, .modal input {
      width: 100%;
      min-height: 38px;
      border: 3px solid var(--ink);
      border-radius: 0;
      background: #eee9c7;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 13px;
      padding: 8px 11px;
    }
    .input:focus, .modal input:focus { outline: 3px solid var(--button); outline-offset: 2px; }
    .field-help { color: var(--ink-soft); font-size: 11px; }

    img, .chart-image {
      max-width: 100%;
      width: 100%;
      border: 3px solid var(--ink);
      border-radius: 0;
      background: rgba(199, 216, 138, 0.62);
    }
    .card-image {
      display: block;
      width: 100%;
      max-width: 260px;
      aspect-ratio: 3 / 4;
      object-fit: contain;
      object-position: center;
      padding: 8px;
      image-rendering: auto;
    }
    .price-history-chart {
      background: rgba(199, 216, 138, 0.62);
      margin-bottom: var(--sp-2);
    }
    .price-history-chart svg { display: block; width: 100%; height: auto; }

    .empty-state, #loading-msg {
      display: grid;
      gap: 6px;
      padding: var(--sp-4);
      border: 3px dashed var(--ink);
      color: var(--ink-soft);
      background: rgba(199, 216, 138, 0.42);
      font-family: var(--font-display);
      text-align: center;
      text-transform: uppercase;
    }
    .empty-state strong { color: var(--ink); font-family: var(--font-display); font-size: 16px; }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--sp-2); }
    .product-card, .card {
      display: flex;
      flex-direction: column;
      gap: var(--sp-1);
      padding: var(--sp-2);
      border: 3px solid var(--ink);
      background: rgba(199, 216, 138, 0.62);
      color: var(--ink);
      text-decoration: none;
    }
    .product-card__header, .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-1); margin-bottom: var(--sp-1); }
    .product-card__title, .card-title { color: var(--ink); font-family: var(--font-display); font-size: 13px; font-weight: 900; line-height: 1.35; text-transform: uppercase; }
    .product-card__meta, .card-lang { color: var(--ink-soft); font-family: var(--font-display); font-size: 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; margin-bottom: var(--sp-1); }
    .mini-metrics, .card-prices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-1); }
    .mini-metrics .metric-card { min-height: auto; padding: 12px; }
    .mini-metrics .metric-value { font-size: 17px; }
    .price-box { padding: 10px 12px; border: 2px solid var(--ink); background: rgba(238, 233, 199, 0.55); }
    .price-box span { display: block; margin-bottom: 4px; color: var(--ink-soft); font-family: var(--font-display); font-size: 10px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; }
    .price-box strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 15px; font-weight: 900; }
    .card-actions { display: flex; justify-content: flex-end; margin-top: var(--sp-2); }

    .trend, .trend--flat, .trend.flat, .trend.neutral { color: var(--ink-soft); font-family: var(--font-display); font-size: 11px; font-weight: 900; }
    .trend--up, .trend.up { color: var(--red); }
    .trend--down, .trend.down { color: var(--green); }
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #fff7d6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .htmx-indicator { opacity: 0; transition: opacity 200ms ease; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      background: rgba(10, 15, 8, 0.72);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 420px;
      max-width: 90vw;
      padding: var(--sp-3);
      border: 4px solid var(--ink);
      background: var(--case);
      box-shadow: 6px 6px 0 var(--shadow);
    }
    .modal h2 {
      margin: 0 0 var(--sp-2);
      padding-bottom: var(--sp-1);
      border-bottom: 3px double var(--ink);
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 15px;
      text-transform: uppercase;
    }
    .modal label { display: block; margin-bottom: 4px; color: var(--ink-soft); font-family: var(--font-display); font-size: 10px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; }
    .modal input { margin-bottom: var(--sp-2); }
    .marketplace-fee-preview {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 0 0 var(--sp-2);
      padding: 10px;
      border: 3px solid var(--ink);
      background: rgba(199, 216, 138, 0.62);
      font-family: var(--font-display);
    }
    .marketplace-fee-preview div {
      min-width: 0;
      padding: 8px;
      border: 2px solid var(--ink);
      background: #eee9c7;
    }
    .marketplace-fee-preview span {
      display: block;
      margin-bottom: 5px;
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .marketplace-fee-preview strong {
      display: block;
      color: var(--ink);
      font-size: 17px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }
    .marketplace-fee-preview p {
      grid-column: 1 / -1;
      margin: 0;
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 900;
      line-height: 1.4;
      text-transform: uppercase;
    }
    .marketplace-fee-preview--warning div { background: rgba(141, 101, 18, 0.18); }
    .marketplace-fee-preview--warning strong,
    .marketplace-fee-preview--warning p { color: var(--red); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 2000;
      padding: 10px 16px;
      border: 3px solid var(--ink);
      background: var(--case);
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--shadow);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      text-transform: uppercase;
      transform: translateY(8px);
      transition: opacity 200ms ease, transform 200ms ease;
    }
    .toast.visible { opacity: 1; transform: translateY(0); }
    .toast.ok { border-color: var(--green); color: var(--green); }
    .toast.error { border-color: var(--red); color: var(--red); }

    @media (max-width: 980px) {
      body { display: block; border-width: 6px; }
      .sidebar {
        position: relative;
        width: 100%;
        min-width: 0;
        height: auto;
        border-right: 0;
        border-bottom: 4px solid var(--ink);
      }
      .sidebar nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .sidebar .spacer { display: none; }
      .content { min-height: auto; }
      .topbar { padding: var(--sp-2); }
      .main { padding: var(--sp-2); }
      .field-row { grid-template-columns: 1fr; }
      .field-control { flex-direction: column; align-items: stretch; }
      .toolbar { justify-content: stretch; }
      .toolbar .btn { flex: 1; text-align: center; }
      .identity-layout { grid-template-columns: 1fr; }
      .identity-media { justify-items: center; }
      .card-image { width: min(100%, 240px); }
      .panel-header { align-items: flex-start; flex-direction: column; }
      .panel-subtitle { text-align: left; }
      .dashboard-preview-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .sidebar nav { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .topbar-meta { text-align: left; }
      .metric-grid, .metrics, .dashboard-kpis, .mini-metrics, .card-prices { grid-template-columns: 1fr; }
      .cards-page .cards-data-grid.grid-shell, .cards-page .cards-data-grid .ag-grid-host, .cards-page .cards-data-grid.ag-grid-host { min-height: 420px; }
    }
  </style>
</head>
<body x-data="app()">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>Pokemon Price</h1>
      <span>Tracker</span>
    </div>
    <div class="sidebar-section-label">Navigation</div>
    <nav>
      <a href="/" :class="{ 'active': currentPage === 'dash' }" @click.prevent="navigateTo('/')">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h6V4H4v8Z"/><path d="M14 20h6V4h-6v16Z"/><path d="M4 20h6v-4H4v4Z"/></svg></span> Dashboard
      </a>
      <a href="/cards" :class="{ 'active': currentPage === 'cards' }" @click.prevent="navigateTo('/cards')">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="14" rx="1"/><path d="M4 7h3M17 7h3M10 8h4M10 12h4"/></svg></span> Store Listings
      </a>
      <a href="/inventory" :class="{ 'active': currentPage === 'inventory' }" @click.prevent="navigateTo('/inventory')">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 6h14v12H5V6Z"/><path d="M8 10h8M8 14h8"/></svg></span> Inventory
      </a>
      <a href="/opportunities" :class="{ 'active': currentPage === 'ops' }" @click.prevent="navigateTo('/opportunities')">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4 20 12 12 20 4 12 12 4Z"/><path d="M12 8v8M8 12h8"/></svg></span> Opportunities
      </a>
      <a href="/repricing" :class="{ 'active': currentPage === 'repricing' }" @click.prevent="navigateTo('/repricing')">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 6h12M6 12h12M6 18h12"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg></span> Repricing Queue
      </a>
      <a href="/soldcards" :class="{ 'active': currentPage === 'sold' }" @click.prevent="navigateTo('/soldcards')">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 6h14v12H5V6Z"/><path d="M8 10h8M8 14h5"/><path d="M17 3v3M7 3v3"/></svg></span> Sold Cards
      </a>
      <a href="/reports" :class="{ 'active': currentPage === 'reports' }" @click.prevent="navigateTo('/reports')">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3h7l3 3v15H7V3Z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg></span> Reports
      </a>
    </nav>
    <div class="spacer"></div>
    <div class="sidebar-footer">
      <button id="run-btn" class="btn" :class="{ 'running': schedulerState === 'running' }"
              @click="runScheduler()" :disabled="schedulerState === 'running'">
        <template x-if="schedulerState === 'running'">
          <span class="spinner"></span>
        </template>
        <template x-if="schedulerState !== 'running'">
          <span>Run Scheduler</span>
        </template>
      </button>
      <p x-show="schedulerState === 'done'" style="font-size:11px;color:var(--green);margin:4px 0 0;text-align:center;">Done!</p>
      <p x-show="schedulerState === 'error'" style="font-size:11px;color:var(--red);margin:4px 0 0;text-align:center;" x-text="errorMessage"></p>
    </div>
  </aside>

  <!-- Main content area -->
  <div class="content">
    <!-- Topbar -->
    <div class="topbar">
      <h1 x-text="pageTitle">Dashboard</h1>
      <div class="topbar-meta" x-text="pageMeta"></div>
    </div>

    <!-- Dynamic content -->
    <main class="main" id="content" x-html="pageContent">
    </main>
  </div>

  <script>
    window._agGrids = [];
    window._agGridById = {};

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function idr(value) {
      if (value == null || value === '') return '-';
      var number = Number(value);
      if (!Number.isFinite(number)) return '-';
      return 'Rp ' + Math.round(number).toLocaleString('id-ID');
    }

    function pct(value) {
      if (value == null || value === '') return '-';
      var number = Number(value);
      if (!Number.isFinite(number)) return '-';
      return (number > 0 ? '+' : '') + number.toFixed(1) + '%';
    }

    function parseMoneyInput(value) {
      var cleaned = String(value == null ? '' : value).replace(/[^\d-]/g, '');
      if (!cleaned || cleaned === '-') return null;
      var number = Number(cleaned);
      return Number.isFinite(number) ? number : null;
    }

    function calculateMarketplaceFee(soldPrice, netIncome) {
      if (soldPrice == null || soldPrice <= 0 || netIncome == null) return null;
      var feeAmount = soldPrice - netIncome;
      return {
        feeAmount: feeAmount,
        feePercent: (feeAmount / soldPrice) * 100
      };
    }

    function formatMarketplaceFeePercent(value) {
      if (value == null || !Number.isFinite(value)) return '-';
      return value.toFixed(1).replace(/\.0$/, '') + '%';
    }

    function badgeHtml(label, tone) {
      var safeTone = tone || 'neutral';
      return '<span class="status-badge status-badge--' + safeTone + '">' + escapeHtml(label || '-') + '</span>';
    }

    function trendClass(value) {
      var number = Number(value);
      if (!Number.isFinite(number) || number === 0) return 'flat';
      return number > 0 ? 'up' : 'down';
    }

    var agRenderers = {
      cardLink: function(params) {
        var title = params.value || '-';
        var slug = params.data && params.data.slug;
        if (!slug) return escapeHtml(title);
        return '<a class="table-title" href="/cards/' + encodeURIComponent(slug) + '">' + escapeHtml(title) + '</a>';
      },
      opportunityLink: function(params) {
        var title = params.value || '-';
        var slug = params.data && params.data.slug;
        if (!slug) return escapeHtml(title);
        return '<a class="table-title" href="/opportunities/' + encodeURIComponent(slug) + '">' + escapeHtml(title) + '</a>';
      },
      externalLink: function(params) {
        var title = params.value || '-';
        var url = params.data && params.data.url;
        if (!url) return escapeHtml(title);
        return '<a class="table-title" href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(title) + '</a>';
      },
      alertBadge: function(params) {
        var level = params.value || 'none';
        var label = (params.data && params.data.alert_label) || 'Aligned';
        if (level === 'red') return badgeHtml(label || 'Price too high', 'danger');
        if (level === 'amber') return badgeHtml(label || 'Price a bit high', 'warning');
        return badgeHtml(label || 'Aligned', 'muted');
      },
      badgeDanger: function(params) {
        return badgeHtml(params.value || 'error', 'danger');
      },
      sourceBadge: function(params) {
        return badgeHtml(String(params.value || '-').replace(/_/g, ' '), 'neutral');
      },
      statusBadge: function(params) {
        var status = String(params.value || '-');
        var normalized = status.toLowerCase();
        var tone = normalized === 'converted' || normalized === 'active' || normalized === 'listed' ? 'success'
          : normalized === 'sold' ? 'danger'
          : normalized === 'owned' || normalized === 'open' ? 'warning'
          : 'neutral';
        return badgeHtml(status, tone);
      },
      decisionBadge: function(params) {
        var used = params.data && params.data.used;
        return badgeHtml(params.value || (used ? 'Used' : 'Filtered'), used ? 'success' : 'muted');
      },
      actionBadge: function(params) {
        var action = params.value || 'Aligned';
        if (action === 'Lower price') return badgeHtml(action, 'danger');
        if (action === 'Raise price') return badgeHtml(action, 'warning');
        if (action === 'Missing market data') return badgeHtml(action, 'muted');
        return badgeHtml(action, 'success');
      },
      moneyValue: function(params) {
        var value = idr(params.value);
        var className = value === '-' ? 'table-muted' : 'table-money';
        return '<span class="' + className + '">' + escapeHtml(value) + '</span>';
      },
      suggestedMoney: function(params) {
        if (params.value == null || params.value === '') {
          return '<span class="table-muted">Insufficient market data</span>';
        }
        return agRenderers.moneyValue(params);
      },
      percentValue: function(params) {
        var number = Number(params.value);
        var tone = !Number.isFinite(number) || number === 0 ? 'neutral' : number > 0 ? 'positive' : 'negative';
        return '<span class="table-percent table-percent--' + tone + '">' + escapeHtml(pct(params.value)) + '</span>';
      },
      trend: function(params) {
        return '<span class="trend trend--' + trendClass(params.value) + '">' + escapeHtml(pct(params.value)) + '</span>';
      }
    };

    var agFormatters = {
      idr: function(params) { return idr(params.value); },
      pct: function(params) { return pct(params.value); }
    };

    function buildColumnDefs(rawColumns) {
      return rawColumns.map(function(column) {
        var next = Object.assign({}, column);
        if (typeof next.cellRenderer === 'string') {
          next.cellRenderer = agRenderers[next.cellRenderer] || undefined;
        }
        if (typeof next.valueFormatter === 'string') {
          next.valueFormatter = agFormatters[next.valueFormatter] || undefined;
        }
        delete next.alwaysRender;
        next.sortable = next.sortable !== false;
        next.filter = next.filter !== false;
        next.resizable = next.resizable !== false;
        return next;
      });
    }

    function destroyAgGrids() {
      (window._agGrids || []).forEach(function(api) {
        if (api && typeof api.destroy === 'function') api.destroy();
      });
      window._agGrids = [];
      window._agGridById = {};
    }

    function getGridApi(gridId) {
      return window._agGridById && window._agGridById[gridId];
    }

    function filterRepricing(action) {
      var api = getGridApi('repricing-table');
      if (!api) return;
      api.setFilterModel(action ? {
        recommended_action: {
          type: 'equals',
          filter: action
        }
      } : null);
      if (typeof api.onFilterChanged === 'function') api.onFilterChanged();
    }

    function sortRepricing(mode) {
      var api = getGridApi('repricing-table');
      if (!api) return;
      var sortModel = [];
      if (mode === 'delta_desc') sortModel = [{ colId: 'delta_percent', sort: 'desc' }];
      if (mode === 'delta_asc') sortModel = [{ colId: 'delta_percent', sort: 'asc' }];
      if (mode === 'tokopedia_desc') sortModel = [{ colId: 'tokopedia_price', sort: 'desc' }];
      if (mode === 'market_desc') sortModel = [{ colId: 'market_avg_price', sort: 'desc' }];
      if (typeof api.applyColumnState === 'function') {
        api.applyColumnState({
          defaultState: { sort: null },
          state: sortModel,
        });
      }
    }

    function resolveAgTheme() {
      if (!window.agGrid || !window.agGrid.themeQuartz || !window.agGrid.colorSchemeDarkBlue) {
        return null;
      }
      if (typeof window.agGrid.themeQuartz.withPart !== 'function') {
        return null;
      }
      return window.agGrid.themeQuartz.withPart(window.agGrid.colorSchemeDarkBlue);
    }

    function initAgGrids(root) {
      var scope = root || document;
      var hosts = scope.querySelectorAll('.ag-grid-host[data-columns][data-rows]');
      hosts.forEach(function(host) {
        if (!window.agGrid || typeof window.agGrid.createGrid !== 'function') {
          host.innerHTML = '<div class="empty-state"><strong>Table failed to load</strong><span>AG Grid assets are unavailable.</span></div>';
          return;
        }
        try {
          var columns = JSON.parse(host.dataset.columns || '[]');
          var rows = JSON.parse(host.dataset.rows || '[]');
          var isCardsGrid = host.classList.contains('cards-data-grid');
          var gridOptions = {
            columnDefs: buildColumnDefs(columns),
            rowData: rows,
            animateRows: true,
            rowHeight: isCardsGrid ? 72 : 44,
            headerHeight: 42,
            pagination: rows.length > 12,
            paginationPageSize: 12,
            paginationPageSizeSelector: [12, 25, 50, 100],
            suppressCellFocus: true,
            enableCellTextSelection: true,
            domLayout: rows.length <= 6 ? 'autoHeight' : 'normal',
            autoSizeStrategy: {
              type: 'fitGridWidth'
            },
            defaultColDef: {
              flex: 1,
              minWidth: 140,
              resizable: true,
              sortable: true,
              filter: true,
              wrapText: true,
              autoHeight: true
            }
          };
          var theme = resolveAgTheme();
          if (theme) gridOptions.theme = theme;
          var gridApi = window.agGrid.createGrid(host, gridOptions);
          window._agGrids.push(gridApi);
          if (host.dataset.gridId) window._agGridById[host.dataset.gridId] = gridApi;
          if (gridApi && typeof gridApi.sizeColumnsToFit === 'function') {
            requestAnimationFrame(function() {
              gridApi.sizeColumnsToFit();
            });
          }
        } catch (error) {
          console.error('AG Grid init failed:', error);
          host.innerHTML = '<div class="empty-state"><strong>Table failed to load</strong><span>' + escapeHtml(error.message) + '</span></div>';
        }
      });
    }

    function app() {
      return {
        currentPage: 'dash',
        pageTitle: 'Dashboard',
        pageMeta: '',
        pageContent: '',
        schedulerState: 'idle',
        errorMessage: '',

        setPage(page) {
          this.currentPage = page;
          if (page === 'dash') {
            this.pageTitle = 'Dashboard';
            this.pageMeta = 'Portfolio overview across your active Tokopedia listings.';
          } else if (page === 'cards') {
            this.pageTitle = 'Store Listings';
            this.pageMeta = 'Tokopedia listing prices, market averages, alerts, and store sync.';
          } else if (page === 'repricing') {
            this.pageTitle = 'Repricing Queue';
            this.pageMeta = 'Cards that need Tokopedia price action.';
          } else if (page === 'ops') {
            this.pageTitle = 'Buying Opportunities';
            this.pageMeta = 'Buy-list cards before they become owned inventory or active listings.';
          } else if (page === 'inventory') {
            this.pageTitle = 'Owned Inventory';
            this.pageMeta = 'Owned cards from buy-list conversions and listing lifecycles.';
          } else if (page === 'reports') {
            this.pageTitle = 'Reports';
            this.pageMeta = 'Generated reports and source health diagnostics.';
          } else if (page === 'sold') {
            this.pageTitle = 'Sold Cards';
            this.pageMeta = 'Cards that have been sold or delisted from Tokopedia.';
          }
        },

        navigateTo(path, pushState) {
          if (pushState !== false && window.location.pathname !== path) {
            history.pushState({ path: path }, '', path);
          }
          var url = '/api/dashboard';
          if (path === '/cards') {
            this.setPage('cards');
            url = '/api/cards';
          } else if (path === '/opportunities') {
            this.setPage('ops');
            url = '/api/opportunities';
          } else if (path === '/inventory') {
            this.setPage('inventory');
            url = '/api/inventory';
          } else if (path === '/repricing') {
            this.setPage('repricing');
            url = '/api/repricing';
          } else if (path === '/reports') {
            this.setPage('reports');
            url = '/api/reports';
          } else if (path === '/soldcards') {
            this.setPage('sold');
            url = '/api/soldcards';
          } else if (path.startsWith('/cards/')) {
            this.currentPage = 'card-detail';
            this.pageTitle = 'Card Detail';
            this.pageMeta = 'Loading...';
            url = '/api/cards/' + path.replace('/cards/', '');
          } else if (path.startsWith('/opportunities/')) {
            this.currentPage = 'opportunity-detail';
            this.pageTitle = 'Opportunity Detail';
            this.pageMeta = 'Buy-list source, pricing, and conversion workflow.';
            url = '/api/opportunities/' + path.replace('/opportunities/', '');
          } else {
            this.setPage('dash');
          }

          var self = this;
          destroyAgGrids();
          this.pageContent = '<p id="loading-msg">LOADING: ' + url + '</p>';
          console.log('Set loading:', url);
          fetch(url)
            .then(function(r) { return r.text(); })
            .then(function(html) {
              console.log('Fetched content length:', html.length);
              destroyAgGrids();
              self.pageContent = html;
              if (self.currentPage === 'card-detail') self.pageMeta = 'Pricing evidence, run health, and source observations.';
              requestAnimationFrame(function() {
                initAgGrids(document.getElementById('content'));
              });
            })
            .catch(function(e) {
              console.error('Fetch error:', e);
              self.pageContent = '<p>Error loading: ' + url + '</p>';
            });
        },

        init() {
          window.__INIT_CALLED = true;
          window._app = this;
          var path = window.location.pathname;
          this.navigateTo(path, false);
          var self = this;
          window.addEventListener('popstate', function(event) {
            self.navigateTo((event.state && event.state.path) || window.location.pathname, false);
          });
          document.addEventListener('click', function(event) {
            var link = event.target.closest('a[href^="/cards/"], a[href^="/opportunities/"]');
            if (!link || link.target === '_blank') return;
            event.preventDefault();
            self.navigateTo(link.getAttribute('href'));
          });
          document.addEventListener('click', function(event) {
            var link = event.target.closest('a[href="/"], a[href="/cards"], a[href="/reports"], a[href="/opportunities"], a[href="/inventory"], a[href="/repricing"], a[href="/soldcards"]');
            if (!link || link.target === '_blank') return;
            event.preventDefault();
            self.navigateTo(link.getAttribute('href'));
          });
        },

        async runScheduler() {
          if (this.schedulerState === 'running') return;
          this.schedulerState = 'running';
          this.errorMessage = '';

          try {
            var res = await fetch('/run', { method: 'POST' });
            var data = await res.json();
            if (!data.ok) {
              this.schedulerState = 'error';
              this.errorMessage = data.error || 'Unknown error';
              return;
            }

            var evtSource = new EventSource('/run/status');
            var self = this;
            evtSource.onmessage = function(event) {
              var status = event.data;
              if (status === 'done') {
                evtSource.close();
                self.schedulerState = 'done';
                self.navigateTo(window.location.pathname);
              } else if (status === 'error') {
                evtSource.close();
                self.schedulerState = 'error';
                self.errorMessage = 'Scheduler failed';
              }
            };
            evtSource.onerror = function() {
              evtSource.close();
              self.schedulerState = 'idle';
            };
          } catch(e) {
            this.schedulerState = 'error';
            this.errorMessage = e.message;
          }
        },

        refreshCard(slug) {
          if (window._refreshing) return;
          window._refreshing = slug;
          var btn = document.getElementById('refresh-btn');
          var btnText = document.getElementById('refresh-btn-text');
          if (btn) btn.disabled = true;
          if (btn) btn.classList.add('running');
          if (btnText) btnText.innerHTML = '<span class="spinner"></span> Refreshing…';
          fetch('/run/' + slug, { method: 'POST' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
              if (!data.ok) {
                window._refreshing = null;
                if (btn) btn.disabled = false;
                if (btn) btn.classList.remove('running');
                if (btnText) btnText.textContent = 'Refresh Prices';
                showToast(data.error || 'Refresh failed', 'error');
                return;
              }
              var pollInterval = setInterval(function() {
                fetch('/run/' + slug + '/status')
                  .then(function(r) { return r.json(); })
                  .then(function(status) {
                    if (status.state === 'done') {
                      clearInterval(pollInterval);
                      window._refreshing = null;
                      showToast('Prices refreshed', 'ok');
                      window.location.href = '/cards/' + slug;
                    } else if (status.state === 'error') {
                      clearInterval(pollInterval);
                      window._refreshing = null;
                      if (btn) btn.disabled = false;
                      if (btn) btn.classList.remove('running');
                      if (btnText) btnText.textContent = 'Refresh Prices';
                      showToast('Refresh failed', 'error');
                    }
                  })
                  .catch(function() {
                    clearInterval(pollInterval);
                    window._refreshing = null;
                    if (btn) btn.disabled = false;
                    if (btn) btn.classList.remove('running');
                    if (btnText) btnText.textContent = 'Refresh Prices';
                    showToast('Refresh failed', 'error');
                  });
              }, 1000);
            })
            .catch(function() {
              window._refreshing = null;
              if (btn) btn.disabled = false;
              if (btn) btn.classList.remove('running');
              if (btnText) btnText.textContent = 'Refresh Prices';
              showToast('Refresh failed', 'error');
            });
        }
      };
    }

    window._app = null;
    window.refreshCard = function(slug) {
      if (window._app) window._app.refreshCard(slug);
    };

    function openAddCardModal() {
      document.getElementById('add-card-modal').classList.add('open');
    }

    function closeAddCardModal() {
      document.getElementById('add-card-modal').classList.remove('open');
    }

    function openOpportunityModal() {
      document.getElementById('opp-card-name').value = '';
      document.getElementById('opp-card-rarity').value = '';
      document.getElementById('opp-card-language').value = '';
      document.getElementById('opp-source').value = '';
      document.getElementById('opp-link').value = '';
      document.getElementById('opp-price').value = '';
      document.getElementById('opportunity-modal').classList.add('open');
    }

    function closeOpportunityModal() {
      document.getElementById('opportunity-modal').classList.remove('open');
    }

    async function submitOpportunity() {
      var payload = {
        card_name: document.getElementById('opp-card-name').value.trim(),
        card_rarity: document.getElementById('opp-card-rarity').value.trim(),
        card_language: document.getElementById('opp-card-language').value.trim(),
        source: document.getElementById('opp-source').value.trim(),
        link: document.getElementById('opp-link').value.trim(),
        price_idr: document.getElementById('opp-price').value.trim()
      };
      if (!payload.card_name || !payload.card_rarity || !payload.card_language || !payload.source || !payload.link || !payload.price_idr) {
        showToast('All opportunity fields are required', 'error');
        return;
      }
      var res = await fetch('/api/opportunities', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var data = await res.json();
      if (!data.ok) {
        showToast(data.error || 'Failed to add opportunity', 'error');
        return;
      }
      closeOpportunityModal();
      window._app.navigateTo('/opportunities/' + data.slug);
    }

    function openConvertOpportunityModal(slug, price) {
      document.getElementById('convert-opportunity-slug').value = slug || '';
      document.getElementById('convert-bought-price').value = price || '';
      document.getElementById('convert-tokopedia-url').value = '';
      document.getElementById('convert-listing-price').value = '';
      document.getElementById('convert-opportunity-modal').classList.add('open');
    }

    function closeConvertOpportunityModal() {
      document.getElementById('convert-opportunity-modal').classList.remove('open');
    }

    async function submitConvertOpportunity() {
      var slug = document.getElementById('convert-opportunity-slug').value;
      var payload = {
        bought_at_price_idr: document.getElementById('convert-bought-price').value.trim(),
        tokopedia_url: document.getElementById('convert-tokopedia-url').value.trim(),
        listing_price_idr: document.getElementById('convert-listing-price').value.trim()
      };
      if (!slug || !payload.bought_at_price_idr) {
        showToast('Bought price is required', 'error');
        return;
      }
      var res = await fetch('/api/opportunities/' + encodeURIComponent(slug) + '/convert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var data = await res.json();
      if (!data.ok) {
        showToast(data.error || 'Failed to convert opportunity', 'error');
        return;
      }
      closeConvertOpportunityModal();
      showToast(data.created_listing ? 'Converted and listed' : 'Converted to inventory', 'ok');
      window._app.navigateTo('/inventory');
    }

    function openMarkSoldModal(slug) {
      document.getElementById('mark-sold-slug').value = slug || '';
      document.getElementById('mark-sold-mode').value = 'mark';
      document.getElementById('mark-sold-title').textContent = 'Mark Sold';
      document.getElementById('mark-sold-submit').textContent = 'Mark Sold';
      document.getElementById('sold-date-input').value = new Date().toISOString().slice(0, 10);
      document.getElementById('sold-price-input').value = '';
      document.getElementById('bought-price-input').value = '';
      document.getElementById('net-income-input').value = '';
      updateMarketplaceFeePreview();
      document.getElementById('mark-sold-modal').classList.add('open');
    }

    function openEditSaleModal(slug, soldAt, soldPrice, boughtPrice, netIncome) {
      document.getElementById('mark-sold-slug').value = slug || '';
      document.getElementById('mark-sold-mode').value = 'edit';
      document.getElementById('mark-sold-title').textContent = 'Edit Sale';
      document.getElementById('mark-sold-submit').textContent = 'Save Sale';
      document.getElementById('sold-date-input').value = soldAt || new Date().toISOString().slice(0, 10);
      document.getElementById('sold-price-input').value = soldPrice || '';
      document.getElementById('bought-price-input').value = boughtPrice || '';
      document.getElementById('net-income-input').value = netIncome || '';
      updateMarketplaceFeePreview();
      document.getElementById('mark-sold-modal').classList.add('open');
    }

    function closeMarkSoldModal() {
      document.getElementById('mark-sold-modal').classList.remove('open');
    }

    function updateMarketplaceFeePreview() {
      var preview = document.getElementById('marketplace-fee-preview');
      var amount = document.getElementById('marketplace-fee-amount');
      var percent = document.getElementById('marketplace-fee-percent');
      var note = document.getElementById('marketplace-fee-note');
      if (!preview || !amount || !percent || !note) return;
      var soldPrice = parseMoneyInput(document.getElementById('sold-price-input').value);
      var netIncome = parseMoneyInput(document.getElementById('net-income-input').value);
      var fee = calculateMarketplaceFee(soldPrice, netIncome);
      if (!fee) {
        amount.textContent = '-';
        percent.textContent = '-';
        note.textContent = 'Enter sold price and settlement';
        preview.classList.remove('marketplace-fee-preview--warning');
        return;
      }
      amount.textContent = idr(fee.feeAmount);
      percent.textContent = formatMarketplaceFeePercent(fee.feePercent);
      note.textContent = fee.feeAmount < 0
        ? 'Settlement is higher than sold price. Check the sale values.'
        : 'Fee = sold price minus marketplace settlement';
      preview.classList.toggle('marketplace-fee-preview--warning', fee.feeAmount < 0);
    }

    async function submitMarkSold() {
      var slug = document.getElementById('mark-sold-slug').value;
      var mode = document.getElementById('mark-sold-mode').value || 'mark';
      var soldAt = document.getElementById('sold-date-input').value;
      var soldPrice = document.getElementById('sold-price-input').value;
      var boughtPrice = document.getElementById('bought-price-input').value;
      var netIncome = document.getElementById('net-income-input').value;
      if (!slug || !soldAt || !soldPrice || !boughtPrice || !netIncome) {
        showToast('Sold date, sold price, bought price, and net income are required', 'error');
        return;
      }
      var endpoint = mode === 'edit' ? '/sale-details' : '/mark-sold';
      var res = await fetch('/api/cards/' + encodeURIComponent(slug) + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sold_at: soldAt, sold_price_idr: soldPrice, bought_at_price_idr: boughtPrice, net_income_idr: netIncome })
      });
      var data = await res.json();
      if (!data.ok) {
        showToast(data.error || 'Failed to mark sold', 'error');
        return;
      }
      closeMarkSoldModal();
      showToast((mode === 'edit' ? 'Sale updated: ' : 'Marked sold: ') + data.title, 'ok');
      window._app.navigateTo('/soldcards');
    }

    async function submitAddCard() {
      var tokopediaUrl = document.getElementById('new-card-url').value.trim();
      var searchKeyword = document.getElementById('new-card-keyword').value.trim();
      if (!tokopediaUrl) {
        showToast('Tokopedia URL is required', 'error');
        return;
      }
      var res = await fetch('/api/cards/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tokopedia_url: tokopediaUrl, search_keyword: searchKeyword })
      });
      var data = await res.json();
      if (!data.ok) {
        showToast(data.error || 'Failed to add card', 'error');
        return;
      }
      closeAddCardModal();
      window.location.href = '/cards/' + data.slug;
    }

    async function updateSearchTerm(slug) {
      var input = document.getElementById('search-term-input');
      if (!input) return;
      var searchTerm = input.value.trim();
      var res = await fetch('/api/cards/' + slug + '/search-term', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ search_term: searchTerm })
      });
      showToast(res.ok ? 'Search term updated' : 'Failed to update search term', res.ok ? 'ok' : 'error');
    }

    async function updatePrice(slug) {
      var btn = document.getElementById('update-price-btn');
      var original = btn ? btn.textContent : '';
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Syncing...';
      }
      try {
        var res = await fetch('/api/cards/' + slug + '/update-price', { method: 'PUT' });
        var data = await res.json();
        if (!data.ok) {
          showToast(data.error || 'Failed to sync price', 'error');
          return;
        }
        showToast('Store price synced: ' + data.price_display, 'ok');
        window._app.navigateTo('/cards/' + slug, false);
      } catch (e) {
        showToast(e.message || 'Failed to sync price', 'error');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = original || 'Sync Store Price';
        }
      }
    }

    async function generateAiAdvice(slug) {
      var btn = document.getElementById('ai-advice-btn');
      var original = btn ? btn.textContent : '';
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Generating...';
      }
      try {
        var res = await fetch('/api/cards/' + encodeURIComponent(slug) + '/ai-repricing-advice', { method: 'POST' });
        var data = await res.json();
        if (!data.ok) {
          showToast(data.error || 'AI advice failed', 'error');
          return;
        }
        showToast(data.cached ? 'Loaded cached AI advice' : 'AI advice generated', 'ok');
        window._app.navigateTo('/cards/' + slug, false);
      } catch (e) {
        showToast(e.message || 'AI advice failed', 'error');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = original || 'Generate AI Advice';
        }
      }
    }

    async function refreshCounterparts(slug) {
      try {
        var res = await fetch('/api/cards/' + encodeURIComponent(slug) + '/counterparts/refresh', { method: 'POST' });
        var data = await res.json();
        if (!data.ok) {
          showToast(data.error || 'Counterpart refresh failed', 'error');
          return;
        }
        showToast('Counterparts refreshed: ' + (data.counterparts || []).length, 'ok');
        window._app.navigateTo('/cards/' + slug, false);
      } catch (e) {
        showToast(e.message || 'Counterpart refresh failed', 'error');
      }
    }

    async function syncNewProducts() {
      var res = await fetch('/api/products/sync', { method: 'POST' });
      var data = await res.json();
      if (data.ok) {
        var total = (data.added_count || 0) + (data.updated_count || 0) + (data.sold_count || 0) + (data.deduped_count || 0);
        var parts = [];
        if (data.added_count) parts.push('added ' + data.added_count);
        if (data.updated_count) parts.push('updated ' + data.updated_count);
        if (data.repaired_count) parts.push('repaired ' + data.repaired_count);
        if (data.sold_count) parts.push('sold ' + data.sold_count);
        if (data.deduped_count) parts.push('deduped ' + data.deduped_count);
        showToast(total ? 'Store synced: ' + parts.join(', ') : 'Store synced: no changes', 'ok');
        window._app.navigateTo('/cards');
      } else {
        showToast(data.error || 'Sync failed', 'error');
      }
    }

    async function revertSold(slug) {
      var res = await fetch('/api/cards/' + slug + '/revert-sold', { method: 'PUT' });
      var data = await res.json();
      if (data.ok) {
        showToast('Reverted: ' + data.title + ' is active again', 'ok');
        window._app.navigateTo('/soldcards');
      } else {
        showToast(data.error || 'Failed to revert', 'error');
      }
    }

    var _toastTimer;
    function showToast(message, type) {
      var el = document.getElementById('toast');
      el.textContent = message;
      el.className = 'toast ' + (type || 'ok');
      el.classList.add('visible');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(function() { el.classList.remove('visible'); }, 2500);
    }
  </script>
