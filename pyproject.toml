[project]
name = "pokemon-store-scheduler"
version = "0.1.0"
description = "Daily/on-demand Pokemon card price checker for Tokopedia store listings."
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
pokemon-prices = "pokemon_price_scheduler.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ARG"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["pokemon_price_scheduler"]

[tool.coverage.report]
show_missing = true
skip_empty = true